project_id = "tequit-market"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://tequit.mx"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback", "https://tequit.mx/auth/callback", "https://tequit-market.vercel.app/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = false

[auth.sms]
# Supabase owns the OTP; the Send SMS hook transports it through Bird WhatsApp.
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
otp_expiry = 300
otp_length = 6

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
