<style>
        /* Custom styles for the inputs */
        .form-input-craft {
            border: 1px solid #DCE4DE;
            border-radius: 10px;
            background-color: #F7F1E7;
            transition: all 0.2s ease-in-out;
        }
        .form-input-craft:focus {
            border-color: #123C2E;
            outline: none;
            box-shadow: 0 0 0 2px #E3A600, 0 0 0 4px #F7F1E7;
        }
    </style>

<body class="bg-background text-on-background antialiased pb-[80px]">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim z-40">
<div class="flex justify-between items-center px-lg py-md w-full max-w-7xl mx-auto">
<div class="flex items-center gap-md">
<button class="text-primary dark:text-primary-fixed cursor-pointer active:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg font-bold text-primary dark:text-primary-fixed">Tequit</h1>
</div>
<div class="flex items-center">
<button class="text-on-surface-variant dark:text-outline cursor-pointer active:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md mx-auto px-base py-xl md:py-xxl">
<!-- Step Indicator -->
<div class="mb-xl">
<h2 class="font-title-md text-title-md text-primary mb-sm">Únete a Tequit</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-md">Paso 1 de 3: Datos Básicos</p>
<div class="flex gap-xs w-full">
<div class="h-2 flex-1 bg-primary-container rounded-full"></div>
<div class="h-2 flex-1 bg-surface-variant rounded-full"></div>
<div class="h-2 flex-1 bg-surface-variant rounded-full"></div>
</div>
</div>
<!-- Registration Form -->
<form class="space-y-lg bg-surface-container-low p-lg rounded-xl border border-outline-variant shadow-sm" style="box-shadow: 0 4px 12px rgba(23, 35, 29, 0.05);">
<!-- Nombre Completo -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="fullName">Nombre Completo</label>
<input class="form-input-craft w-full px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-outline" id="fullName" name="fullName" placeholder="Ej. Juan Pérez" required="" type="text"/>
</div>
<!-- Oficio / Especialidad -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="trade">Oficio o Especialidad</label>
<select class="form-input-craft w-full px-md py-sm font-body-md text-body-md text-on-surface" id="trade" name="trade" required="">
<option disabled="" selected="" value="">Selecciona un oficio</option>
<option value="plomero">Plomería</option>
<option value="electricista">Electricidad</option>
<option value="carpintero">Carpintería</option>
<option value="limpieza">Limpieza General</option>
<option value="otro">Otro</option>
</select>
</div>
<!-- Teléfono -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="phone">Teléfono Móvil (WhatsApp)</label>
<input class="form-input-craft w-full px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-outline" id="phone" name="phone" placeholder="311 000 0000" required="" type="tel"/>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-xs">Usaremos este número para conectarte con clientes en Tepic.</p>
</div>
<!-- Años de Experiencia -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="experience">Años de Experiencia</label>
<input class="form-input-craft w-full px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-outline" id="experience" min="0" name="experience" placeholder="Ej. 5" required="" type="number"/>
</div>
<!-- Acciones -->
<div class="pt-md">
<button class="w-full bg-primary-container text-on-primary py-md rounded-[10px] font-label-md text-label-md hover:bg-opacity-90 active:scale-95 transition-all shadow-md" type="submit">
                    Continuar
                </button>
</div>
</form>
<!-- Decorative Element -->
<div class="mt-xl flex justify-center opacity-50">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 0;">handyman</span>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center px-base pb-safe bg-surface-container dark:bg-surface-container-highest border-t border-outline-variant z-50 h-[64px]">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-variant dark:hover:bg-inverse-surface scale-95 active:scale-90 transition-transform duration-150 p-sm rounded-xl" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label-sm text-label-sm mt-xs">Inicio</span>
</a>
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed bg-primary-fixed dark:bg-primary-container rounded-xl px-md py-xs scale-95 active:scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person_add</span>
<span class="font-label-sm text-label-sm mt-xs">Registro</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-variant dark:hover:bg-inverse-surface scale-95 active:scale-90 transition-transform duration-150 p-sm rounded-xl" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_circle</span>
<span class="font-label-sm text-label-sm mt-xs">Perfil</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-variant dark:hover:bg-inverse-surface scale-95 active:scale-90 transition-transform duration-150 p-sm rounded-xl" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">help_outline</span>
<span class="font-label-sm text-label-sm mt-xs">Ayuda</span>
</a>
</nav>
</body></html>
